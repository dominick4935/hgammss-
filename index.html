<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>GameHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1 class="logo">GameHub<span>.</span></h1>
  <nav class="nav" aria-label="Main">
    <button class="nav-btn active" data-page="home">Games</button>
    <button class="nav-btn" data-page="browser">Browser</button>
    <button class="nav-btn" data-page="favorites">
      Favorites <span id="favCount" class="badge">0</span>
    </button>
  </nav>
</header>

<main>
  <!-- GAMES -->
  <section id="home" class="page">
    <div class="hero">
      <h2>Play Without Limits.</h2>
      <p>Your gaming collection, all in one place.</p>
      <input id="search" type="search" autocomplete="off"
        placeholder="Search games…  (press / to focus)" aria-label="Search games">
    </div>

    <div id="categories" class="chips" role="group" aria-label="Filter by category"></div>

    <div class="section-head">
      <h2>Game Library</h2>
      <span id="resultCount" class="muted"></span>
    </div>
    <div id="games" class="game-grid"></div>
    <p id="gamesEmpty" class="empty hidden">No games match your search.</p>
  </section>

  <!-- BROWSER -->
  <section id="browser" class="page hidden">
    <h2>Web Browser</h2>
    <form id="browserForm" class="browser-bar">
      <input id="browserInput" type="text" autocomplete="off" required
        placeholder="Search with Brave or enter a website" aria-label="Search or address">
      <button type="submit" class="primary">Go</button>
    </form>
    <p id="browserMessage" class="muted"></p>

    <div id="frameWrap" class="frame-wrap hidden">
      <div class="frame-toolbar">
        <button id="frameBack" type="button" title="Back">←</button>
        <button id="frameHome" type="button" title="Brave Search home">⌂</button>
        <span id="frameUrl" class="frame-url"></span>
        <button id="frameFull" type="button" title="Fullscreen">⛶</button>
      </div>
      <!-- No allow-popups / allow-top-navigation: pages can't open new tabs or leave GameHub -->
      <iframe id="browserFrame" title="Embedded website" referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>
  </section>

  <!-- FAVORITES -->
  <section id="favorites" class="page hidden">
    <h2>Your Favorites</h2>
    <div id="favoriteGames" class="game-grid"></div>
    <p id="favoritesEmpty" class="empty hidden">No favorites yet — tap ☆ on any game to save it here.</p>
  </section>

  <!-- PLAYER -->
  <section id="player" class="page hidden">
    <div class="player-bar">
      <button id="backBtn">← Back to games</button>
      <h2 id="playerTitle"></h2>
      <button id="fullscreenBtn">⛶ Fullscreen</button>
    </div>
    <iframe id="gameFrame" title="Game player" allowfullscreen></iframe>
  </section>
</main>

<footer>GameHub © 2026</footer>
<script src="script.js"></script>
</body>
</html>
